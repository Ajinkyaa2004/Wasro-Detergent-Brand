[pytest]
# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show timings, fail fast on collection errors, colour
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --durations=10
    --html=report.html
    --self-contained-html

# Markers for grouping
markers =
    smoke: critical-path tests that should run first
    admin: tests that hit /admin (need login)
    interactive: tests that drive scroll/drag/animation
    mobile: tests run in a mobile viewport
    write: tests that PERSIST to Upstash (admin save → public read).
           Restore the original value at the end. Skip with `-m "not write"`.
